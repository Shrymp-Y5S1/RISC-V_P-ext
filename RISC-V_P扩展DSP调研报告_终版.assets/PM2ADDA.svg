<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="100%" height="100%"
    style="background-color: #ffffff;">
    <style>
        text {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            fill: #333333;
        }

        .title {
            font-size: 18px;
            font-weight: 600;
            fill: #1a1a1a;
        }

        .subtitle {
            font-size: 14px;
            font-weight: 500;
            fill: #444444;
        }

        .text-dark {
            font-size: 13px;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #333333;
        }

        .text-light {
            font-size: 13px;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #ffffff;
        }

        .text-dark-small {
            font-size: 11px;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #333333;
        }

        .text-light-small {
            font-size: 11px;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #ffffff;
        }

        .h3 {
            fill: #1e3a5f;
            stroke: #0f213b;
            stroke-width: 1.2;
        }

        .h2 {
            fill: #5b8bcf;
            stroke: #3b6399;
            stroke-width: 1.2;
        }

        .h1 {
            fill: #99badd;
            stroke: #6f92b8;
            stroke-width: 1.2;
        }

        .h0 {
            fill: #cdddf2;
            stroke: #9eb2cc;
            stroke-width: 1.2;
        }

        .g3 {
            fill: #1e4a3a;
            stroke: #0f2b22;
            stroke-width: 1.2;
        }

        .g2 {
            fill: #5baf8a;
            stroke: #3b8064;
            stroke-width: 1.2;
        }

        .g1 {
            fill: #99ccb5;
            stroke: #6fa28e;
            stroke-width: 1.2;
        }

        .g0 {
            fill: #cdeddc;
            stroke: #9ec4ae;
            stroke-width: 1.2;
        }

        .rd-box {
            fill: #f5c29a;
            stroke: #cd9366;
            stroke-width: 1.2;
        }

        .op-box {
            fill: #ffffff;
            stroke: #333333;
            stroke-width: 1.2;
        }

        .code-bg {
            fill: #f8f9fa;
            stroke: #cbd5e1;
            stroke-width: 1.2;
            rx: 8px;
        }

        .arrow {
            stroke: #333333;
            stroke-width: 1.2;
            fill: none;
        }

        .arrow-head {
            fill: #333333;
        }

        .inst-box {
            fill: none;
            stroke: #b0bec5;
            stroke-width: 1;
            stroke-dasharray: 4, 4;
        }

        .op-divider {
            stroke: #ccc;
            stroke-width: 0.8;
            stroke-dasharray: 3, 3;
        }

        .combine-bus {
            stroke: #cd9366;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
        }

        .combine-node {
            fill: #f5c29a;
            stroke: #cd9366;
            stroke-width: 1.2;
        }
    </style>

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
        </marker>
    </defs>

    <!-- Title -->
    <text x="30" y="28" class="title">PM2ADDA.H: Packed Multiply-2 Add-Accumulate</text>
    <text x="30" y="48" class="subtitle">d[i] = d[i] + a1*b1 + a0*b0 per 32-bit lane (XLEN=64)</text>

    <!-- Shared inst-box wrapping both lanes -->
    <rect x="50" y="106" width="430" height="100" rx="4" class="inst-box" />

    <!-- ============ Lane i=1 (cx=165) ============ -->
    <text x="165" y="70" class="text-dark-small" style="font-weight: bold;">i = 1</text>

    <!-- Input boxes: bottom at y=94, inst-box top at y=106, gap=12px -->
    <rect x="100" y="76" width="28" height="18" rx="2" class="h3" />
    <text x="114" y="85" class="text-light-small">a1</text>

    <rect x="132" y="76" width="28" height="18" rx="2" class="g3" />
    <text x="146" y="85" class="text-light-small">b1</text>

    <rect x="170" y="76" width="28" height="18" rx="2" class="h2" />
    <text x="184" y="85" class="text-light-small">a0</text>

    <rect x="202" y="76" width="28" height="18" rx="2" class="g2" />
    <text x="216" y="85" style="font-size: 11px; text-anchor: middle; dominant-baseline: middle; fill: #333;">b0</text>

    <!-- L-arrows into multiplier circles -->
    <path d="M 114 94 L 114 130 L 116 130" class="arrow" marker-end="url(#arrow)" />
    <path d="M 146 94 L 146 130 L 144 130" class="arrow" marker-end="url(#arrow)" />
    <path d="M 184 94 L 184 130 L 186 130" class="arrow" marker-end="url(#arrow)" />
    <path d="M 216 94 L 216 130 L 214 130" class="arrow" marker-end="url(#arrow)" />

    <!-- Multiplier circles -->
    <circle cx="130" cy="130" r="14" class="op-box" />
    <text x="130" y="130" class="text-dark">&#215;</text>

    <circle cx="200" cy="130" r="14" class="op-box" />
    <text x="200" y="130" class="text-dark">&#215;</text>

    <!-- d (accumulate source from rd) -->
    <rect x="153" y="122" width="24" height="16" rx="2" class="rd-box" />
    <text x="165" y="130" style="font-size: 9px; text-anchor: middle; dominant-baseline: middle; fill: #333;">d[i]</text>

    <!-- L-arrows from multipliers and d into adder -->
    <path d="M 130 144 L 130 170 L 151 170" class="arrow" marker-end="url(#arrow)" />
    <path d="M 200 144 L 200 170 L 179 170" class="arrow" marker-end="url(#arrow)" />
    <path d="M 165 138 L 165 156" class="arrow" marker-end="url(#arrow)" />

    <!-- Adder circle -->
    <circle cx="165" cy="170" r="14" class="op-box" />
    <text x="165" y="170" class="text-dark" style="font-weight: bold;">+</text>

    <!-- Output -->
    <path d="M 165 184 L 165 198" class="arrow" marker-end="url(#arrow)" />
    <rect x="120" y="198" width="90" height="24" rx="2" class="rd-box" />
    <text x="165" y="210" class="text-dark-small">d[63:32]</text>

    <!-- ============ Lane i=0 (cx=385) ============ -->
    <text x="385" y="70" class="text-dark-small" style="font-weight: bold;">i = 0</text>

    <!-- Input boxes -->
    <rect x="320" y="76" width="28" height="18" rx="2" class="h1" />
    <text x="334" y="85" class="text-dark-small">a1</text>

    <rect x="352" y="76" width="28" height="18" rx="2" class="g1" />
    <text x="366" y="85" class="text-dark-small">b1</text>

    <rect x="390" y="76" width="28" height="18" rx="2" class="h0" />
    <text x="404" y="85" class="text-dark-small">a0</text>

    <rect x="422" y="76" width="28" height="18" rx="2" class="g0" />
    <text x="436" y="85" class="text-dark-small">b0</text>

    <!-- L-arrows into multiplier circles -->
    <path d="M 334 94 L 334 130 L 336 130" class="arrow" marker-end="url(#arrow)" />
    <path d="M 366 94 L 366 130 L 364 130" class="arrow" marker-end="url(#arrow)" />
    <path d="M 404 94 L 404 130 L 406 130" class="arrow" marker-end="url(#arrow)" />
    <path d="M 436 94 L 436 130 L 434 130" class="arrow" marker-end="url(#arrow)" />

    <!-- Multiplier circles -->
    <circle cx="350" cy="130" r="14" class="op-box" />
    <text x="350" y="130" class="text-dark">&#215;</text>

    <circle cx="420" cy="130" r="14" class="op-box" />
    <text x="420" y="130" class="text-dark">&#215;</text>

    <!-- d (accumulate source from rd) -->
    <rect x="373" y="122" width="24" height="16" rx="2" class="rd-box" />
    <text x="385" y="130" style="font-size: 9px; text-anchor: middle; dominant-baseline: middle; fill: #333;">d[i]</text>

    <!-- L-arrows from multipliers and d into adder -->
    <path d="M 350 144 L 350 170 L 371 170" class="arrow" marker-end="url(#arrow)" />
    <path d="M 420 144 L 420 170 L 399 170" class="arrow" marker-end="url(#arrow)" />
    <path d="M 385 138 L 385 156" class="arrow" marker-end="url(#arrow)" />

    <!-- Adder circle -->
    <circle cx="385" cy="170" r="14" class="op-box" />
    <text x="385" y="170" class="text-dark" style="font-weight: bold;">+</text>

    <!-- Output -->
    <path d="M 385 184 L 385 198" class="arrow" marker-end="url(#arrow)" />
    <rect x="340" y="198" width="90" height="24" rx="2" class="rd-box" />
    <text x="385" y="210" class="text-dark-small">d[31:0]</text>

    <!-- Detail panel -->
    <rect x="510" y="68" width="120" height="138" rx="6" class="code-bg" />
    <text x="570" y="84" class="text-dark-small" style="font-weight: bold;">Register Map</text>
    <line x1="518" y1="92" x2="622" y2="92" class="op-divider" />
    <text x="570" y="106" style="font-family: 'Courier New', monospace; font-size: 9px; text-anchor: middle; dominant-baseline: middle; fill: #333;">a0,a1 &#8592; rs1</text>
    <text x="570" y="119" style="font-family: 'Courier New', monospace; font-size: 9px; text-anchor: middle; dominant-baseline: middle; fill: #333;">b0,b1 &#8592; rs2</text>
    <text x="570" y="132" style="font-family: 'Courier New', monospace; font-size: 9px; text-anchor: middle; dominant-baseline: middle; fill: #333;">d[i] &#8592; rd</text>
    <line x1="518" y1="142" x2="622" y2="142" class="op-divider" />
    <text x="570" y="156" style="font-family: 'Courier New', monospace; font-size: 9px; text-anchor: middle; dominant-baseline: middle; fill: #333; font-weight: bold;">Operation:</text>
    <text x="570" y="169" style="font-family: 'Courier New', monospace; font-size: 9px; text-anchor: middle; dominant-baseline: middle; fill: #333;">d[i] += a1*b1</text>
    <text x="570" y="182" style="font-family: 'Courier New', monospace; font-size: 9px; text-anchor: middle; dominant-baseline: middle; fill: #333;">       + a0*b0</text>
    <text x="570" y="196" style="font-family: 'Courier New', monospace; font-size: 8px; text-anchor: middle; dominant-baseline: middle; fill: #888;">(sext to 32-bit)</text>

    <!-- Connector: inst-box to detail panel -->
    <path d="M 480 156 L 510 156" stroke="#b0bec5" stroke-width="1" stroke-dasharray="3,3" fill="none" />

    <!-- Combine bus -->
    <path d="M 165 222 L 165 240" class="arrow" />
    <path d="M 385 222 L 385 240" class="arrow" />

    <line x1="165" y1="240" x2="385" y2="240" class="combine-bus" />
    <circle cx="275" cy="240" r="6" class="combine-node" />

    <path d="M 275 246 L 275 262" class="arrow" marker-end="url(#arrow)" />
    <rect x="210" y="262" width="130" height="25" rx="2" class="rd-box" />
    <text x="275" y="274.5" class="text-dark-small" style="font-weight: bold;">Pack d[63:0]</text>

    <path d="M 340 274.5 L 369 274.5" class="arrow" marker-end="url(#arrow)" />
    <rect x="372" y="260" width="95" height="28" rx="4" class="code-bg" />
    <text x="419.5" y="274" class="text-dark" style="font-weight: bold;">X[rd]</text>

</svg>
